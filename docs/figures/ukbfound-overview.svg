<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ukbFound overview</title>
  <desc id="desc">A conceptual overview of tokenising UKB-style phenotypes, encoding them with a Transformer model, and applying the learned representations to downstream analyses.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .panel-blue { fill: #eff6ff; stroke: #60a5fa; }
      .panel-green { fill: #ecfdf5; stroke: #34d399; }
      .panel-amber { fill: #fffbeb; stroke: #f59e0b; }
      .panel-rose { fill: #fff1f2; stroke: #fb7185; }
      .title { fill: #111827; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; }
      .label { fill: #111827; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; }
      .body { fill: #334155; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .small { fill: #475569; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .token { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .dot-blue { fill: #2563eb; }
      .dot-green { fill: #059669; }
      .dot-amber { fill: #d97706; }
      .dot-rose { fill: #e11d48; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>
  <text class="title" x="60" y="62">ukbFound: foundation model for deep phenotyping</text>
  <text class="body" x="60" y="94">Code-only workflow for approved UKB-style phenotype modelling</text>

  <rect class="panel panel-blue" x="60" y="140" width="235" height="250" rx="16"/>
  <text class="label" x="88" y="184">Phenotype table</text>
  <text class="body" x="88" y="218">continuous traits</text>
  <text class="body" x="88" y="248">categorical choices</text>
  <text class="body" x="88" y="278">multi-select fields</text>
  <line x1="88" y1="306" x2="265" y2="306" stroke="#93c5fd" stroke-width="2"/>
  <text class="small" x="88" y="337">Approved local data only</text>
  <circle class="dot-blue" cx="247" cy="184" r="8"/>

  <path class="arrow" d="M 305 265 H 380"/>

  <rect class="panel panel-green" x="390" y="140" width="235" height="250" rx="16"/>
  <text class="label" x="418" y="184">Trait-value tokens</text>
  <rect class="token" x="418" y="216" width="70" height="34" rx="8"/>
  <text class="small" x="436" y="238">trait</text>
  <rect class="token" x="502" y="216" width="70" height="34" rx="8"/>
  <text class="small" x="521" y="238">value</text>
  <rect class="token" x="418" y="268" width="70" height="34" rx="8"/>
  <text class="small" x="440" y="290">Q</text>
  <rect class="token" x="502" y="268" width="70" height="34" rx="8"/>
  <text class="small" x="520" y="290">yes/no</text>
  <text class="body" x="418" y="342">position-free embedding</text>
  <circle class="dot-green" cx="577" cy="184" r="8"/>

  <path class="arrow" d="M 635 265 H 710"/>

  <rect class="panel panel-amber" x="720" y="140" width="235" height="250" rx="16"/>
  <text class="label" x="748" y="184">Transformer encoder</text>
  <rect x="762" y="222" width="148" height="34" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <rect x="762" y="266" width="148" height="34" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <rect x="762" y="310" width="148" height="34" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <text class="small" x="798" y="244">MLM training</text>
  <text class="small" x="793" y="288">trait context</text>
  <text class="small" x="792" y="332">representation</text>
  <circle class="dot-amber" cx="907" cy="184" r="8"/>

  <path class="arrow" d="M 965 265 H 1040"/>

  <rect class="panel panel-rose" x="990" y="140" width="155" height="250" rx="16"/>
  <text class="label" x="1017" y="184">Applications</text>
  <text class="body" x="1017" y="224">stratification</text>
  <text class="body" x="1017" y="258">correlation</text>
  <text class="body" x="1017" y="292">prediction</text>
  <text class="small" x="1017" y="336">interpretable</text>
  <text class="small" x="1017" y="360">phenotyping</text>
  <circle class="dot-rose" cx="1114" cy="184" r="8"/>

  <text class="small" x="60" y="460">Data, token matrices, model weights, and participant-level outputs are intentionally excluded from Git.</text>
</svg>
